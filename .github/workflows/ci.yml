name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r backend/requirements.txt
      # No API key in CI on purpose: the offline path is what the demo runs, so that
      # is the path the suite has to prove.
      - run: python -m pytest tests -q
        working-directory: backend
      - name: Accuracy and fairness report
        run: python -m app.evaluate
        working-directory: backend
      - name: Worked examples
        run: python verify_examples.py
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        # No npm cache on purpose: restoring it is the most reported trigger for
        # `npm ci` hanging and then exiting 0 with "Exit handler never called!".
        # This project installs in ~15s cold, so the cache buys nothing anyway.
        with: { node-version: "20" }
      - name: Install (verified)
        working-directory: frontend
        run: |
          set -eu
          # --include=dev guards against NODE_ENV=production (or an omit=dev npm
          # config) silently skipping devDependencies, which is where vite lives.
          # Bounded: the failing runs hung here for eight minutes before exiting 0.
          timeout 240 npm ci --include=dev --no-audit --no-fund || true
          # npm can abort with "Exit handler never called!" and still exit 0, leaving
          # node_modules incomplete. The build then dies with `vite: not found`, which
          # points at the wrong thing entirely. Check the binary exists rather than
          # trusting the exit code, and fall back to a plain install.
          if [ ! -x node_modules/.bin/vite ]; then
            echo "npm ci did not produce a usable tree — retrying with npm install"
            rm -rf node_modules
            npm install --include=dev --no-audit --no-fund
          fi
          node_modules/.bin/vite --version
      - run: npm run build
        working-directory: frontend
