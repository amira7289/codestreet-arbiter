name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r backend/requirements.txt
      # No API key in CI on purpose: the offline path is what the demo runs, so that
      # is the path the suite has to prove.
      - run: python -m pytest tests -q
        working-directory: backend
      - name: Accuracy and fairness report
        run: python -m app.evaluate
        working-directory: backend
      - name: Worked examples
        run: python verify_examples.py
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        # No npm cache on purpose: restoring it is the most reported trigger for
        # `npm ci` hanging and then exiting 0 with "Exit handler never called!".
        # This project installs in ~15s cold, so the cache buys nothing anyway.
        with: { node-version: "20" }
      - name: Install
        working-directory: frontend
        # `npm install`, not `npm ci`. On these runners npm ci hangs for eight
        # minutes and then exits 0 with "Exit handler never called!" and an
        # incomplete node_modules, so the build fails pointing at vite. Bounding it
        # with `timeout` did not help either: npm's orphaned children keep the step
        # alive after the parent is killed. npm install honours the lockfile and
        # completes in seconds, which is the trade worth making here.
        run: |
          set -eu
          npm install --include=dev --no-audit --no-fund
          # Verify rather than trust an exit code, given the above.
          node_modules/.bin/vite --version
      - run: npm run build
        working-directory: frontend
