# Render Blueprint — deploys both services and wires them to each other.
#
# In Render: New → Blueprint → connect this repo → Apply.
# The cross-service references below mean neither URL has to be pasted by hand:
# the frontend learns the API host, and the API learns which origin to allow.
services:
  - type: web
    name: arbiter-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # Free instances have an ephemeral filesystem, so the database is rebuilt from
    # the seed on every boot. `seed()` is a no-op when data already exists, so this
    # is safe on a persistent disk too if the plan is ever upgraded.
    startCommand: python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DATABASE_PATH
        value: ./disputes.db
      - key: CORS_ORIGINS
        fromService:
          type: web
          name: arbiter-web
          property: host

  - type: web
    name: arbiter-web
    runtime: static
    # No `plan` here on purpose: static sites have no plans, and Render rejects the
    # blueprint outright with "no such plan free for service type web" if one is set.
    # Deliberately no `rootDir`. Combined with staticPublishPath it is ambiguous:
    # the build ran and the service came up, but every path 404'd because Render
    # looked for the publish directory somewhere other than frontend/dist. Explicit
    # paths from the repository root remove the question.
    #
    # --include=dev: Render's build containers set NODE_ENV=production, which makes
    # plain `npm ci` skip devDependencies — and vite lives there.
    # `npm install`, not `npm ci`: npm ci hangs on these builders and then exits 0
    # with an incomplete tree, so the build dies with `vite: not found`. install
    # honours the lockfile and finishes in seconds.
    buildCommand: >-
      cd frontend &&
      npm install --include=dev --no-audit --no-fund &&
      node_modules/.bin/vite --version &&
      npm run build
    staticPublishPath: frontend/dist
    envVars:
      # Pinned so the build is reproducible: Vite 5 needs Node 18+, and a default
      # that drifts is a failure that appears months later for no visible reason.
      - key: NODE_VERSION
        value: "20.11.1"
      # Vite inlines this at build time, so it must be present during the build,
      # not at runtime.
      - key: VITE_API_URL
        fromService:
          type: web
          name: arbiter-api
          property: host
    routes:
      # Client-side routing: /cases/9 is a React route, not a file on disk.
      - type: rewrite
        source: /*
        destination: /index.html
