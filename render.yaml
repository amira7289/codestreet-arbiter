# Render Blueprint — a single service.
#
# The frontend is a prebuilt bundle committed at frontend/dist and served by the
# same FastAPI process as the API. That collapses three moving parts that each
# broke during deployment — a second service, a build-time API URL, and CORS —
# into none. It also keeps npm off the build host, which is where every failure
# actually originated.
#
# Rebuild the bundle after any frontend change:
#   cd frontend && VITE_API_URL= npm run build && git add -f dist
services:
  - type: web
    name: arbiter
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # Free instances have an ephemeral filesystem, so the database is rebuilt from
    # the seed on every boot. seed() is a no-op when data already exists, so this
    # is still correct on a persistent disk.
    startCommand: python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DATABASE_PATH
        value: ./disputes.db
